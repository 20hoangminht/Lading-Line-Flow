[project]
name = "flow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<6",
  "django-ninja>=1.3",
  "psycopg[binary]>=3.2",
  "dj-database-url>=2.2",
  "procrastinate>=2.9",
  "boto3>=1.35",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.7", "moto>=5"]

[tool.setuptools]
packages = ["config", "documents", "review", "validation", "metering", "integrations"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = "test_*.py"
