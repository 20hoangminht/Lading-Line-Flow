name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Build the container image
        run: docker build ./app
      - name: Validate the local services
        run: cp .env.example .env && docker compose config --quiet
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
        working-directory: app
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Check that model changes have migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: app
        env:
          DATABASE_URL: postgresql://flow:flow@localhost:5432/flow
      - name: Guardrail tests
        run: pytest tests/ -v
      - name: Application tests
        run: pytest app/ -v
        env:
          DATABASE_URL: postgresql://flow:flow@localhost:5432/flow
