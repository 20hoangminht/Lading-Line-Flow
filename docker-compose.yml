services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: ./app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes: ["./app:/code"]
    ports: ["8000:8000"]
    env_file: [.env]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: ./app
    command: python manage.py procrastinate worker
    volumes: ["./app:/code"]
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      web: {condition: service_healthy}
volumes:
  pgdata:
